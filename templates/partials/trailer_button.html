{% if movie.trailer_id %}<a class="button trailer-button" href="https://www.youtube.com/watch?v={{ movie.trailer_id }}" target="_blank" rel="noopener" data-trailer="{{ movie.trailer_id }}" data-trailer-name="{{ movie.title }}" data-trailer-channel="{{ movie.trailer_channel }}" aria-haspopup="dialog"><span class="play-triangle" aria-hidden="true">▶</span> Смотреть трейлер</a>{% endif %}
