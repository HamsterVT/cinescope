<button type="button" class="save-button {% if compact %}compact{% else %}button secondary{% endif %}" data-save="{{ movie.id }}" data-title="{{ movie.title }}" data-poster="{{ movie.poster }}" data-year="{{ movie.year }}" data-rating="{{ movie.rating }}" data-genre="{{ movie.genres.0 }}" aria-label="Добавить {{ movie.title }} в список" aria-pressed="false"><span class="save-symbol" aria-hidden="true">+</span>{% if not compact %}<span class="save-label">Буду смотреть</span>{% endif %}</button>
