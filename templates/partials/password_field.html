<div class="password-group">
  <label for="{{ password_id }}">{{ password_label|default:'Пароль' }}</label>
  <div class="password-input"><input id="{{ password_id }}" name="password" type="password" maxlength="128" {% if strong %}minlength="12" data-password-rules aria-describedby="{{ password_id }}-rules"{% endif %} autocomplete="{% if new_password %}new-password{% else %}current-password{% endif %}" required><button type="button" data-show-password aria-controls="{{ password_id }}" aria-pressed="false">Показать</button></div>
  {% if strong %}<ul class="password-rules" id="{{ password_id }}-rules"><li data-rule="length">12–128 символов</li><li data-rule="lower">Строчная латинская буква a–z</li><li data-rule="upper">Заглавная латинская буква A–Z</li><li data-rule="digit">Цифра 0–9</li><li data-rule="symbol">Спецсимвол, например ! или #</li></ul>{% endif %}
</div>
