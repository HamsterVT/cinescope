<div class="cinema-video" data-cinema="{{ movie.trailer_id }}" data-title="{{ movie.title }}"><div class="cinema-screen"><img src="{{ movie.backdrop }}" alt="Кадр: {{ movie.title }}" loading="{% if eager %}eager{% else %}lazy{% endif %}" width="1280" height="720"><div class="cinema-mount"></div></div><div class="cinema-controls"><button type="button" class="cinema-sound" data-sound aria-pressed="false">Включить звук</button><button type="button" data-play aria-label="Пауза">Ⅱ</button><a href="https://www.youtube.com/watch?v={{ movie.trailer_id }}" target="_blank" rel="noopener" aria-label="Открыть трейлер {{ movie.title }} на YouTube">YouTube</a></div><p class="cinema-status" role="status">Без звука · трейлер запускается автоматически</p></div>
